<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#faf3e8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Làm nghề">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Phố Có Chuyện · Một ngày làm nghề — game mô phỏng hơn 20 nghề: nấu mì, pha cà phê, bán hoa, dạy học, kế toán… gặp đủ chuyện đời thật và chơi cùng mọi người.">
  <meta property="og:title" content="Phố Có Chuyện · Một ngày làm nghề">
  <meta property="og:description" content="Thử làm hơn 20 nghề, gặp chuyện đời thật, chơi cùng mọi người.">
  <meta property="og:image" content="/icons/icon-512.png">
  <title>Phố Có Chuyện · Một ngày làm nghề</title>
  <link rel="icon" href="/icons/logo-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="/icons/logo-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Splash + update pill: inline so the first paint never waits for a stylesheet. app.css takes over later. -->
  <style>
    body{margin:0;background:#faf3e8}
    #loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:24px;text-align:center;background:#faf3e8;color:#3a2a21;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #loading[hidden]{display:none}
    html[data-theme="tra_xanh"] #loading,html[data-theme="tra_xanh"] body{background:#eef5e9;color:#1d3320}
    html[data-theme="bien"] #loading,html[data-theme="bien"] body{background:#ecf3f9;color:#132d46}
    html[data-theme="keo"] #loading,html[data-theme="keo"] body{background:#fff1f6;color:#3f1f38}
    html[data-theme="dem"] #loading,html[data-theme="dem"] body{background:#15141b;color:#f3ede5}
    #loading h1{font-size:1.75rem;line-height:1.2;margin:8px 0 2px;font-weight:800}
    #loading p{margin:4px 0;opacity:.78}
    .splash-logo{width:148px;height:148px;margin-bottom:14px;border-radius:32px;background:#f6ecdf url(/icons/logo-296.webp) center/contain no-repeat;box-shadow:0 12px 32px rgba(58,42,33,.16)}
    .splash-bar{width:min(220px,60vw);height:6px;margin-top:18px;border-radius:99px;background:rgba(128,100,80,.2);overflow:hidden}
    .splash-bar i{display:block;height:100%;border-radius:inherit;background:#c44b30;transform-origin:left;transform:scaleX(.05);animation:mnl-boot 10s cubic-bezier(.12,.75,.3,1) forwards}
    @keyframes mnl-boot{to{transform:scaleX(.94)}}
    @media (prefers-reduced-motion:reduce){.splash-bar i{animation:none;transform:scaleX(.6)}}
    .update-pill{position:fixed;inset:auto auto auto 50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:2147483000;margin:0;padding:0;border:0;background:transparent;overflow:visible;display:flex;align-items:center;gap:2px;max-width:calc(100vw - 24px);font:600 14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .update-pill:not(:popover-open):not(.is-open){display:none}
    .update-pill button{border:0;margin:0;font:inherit;cursor:pointer;color:#fff;background:#3a2a21;box-shadow:0 6px 20px rgba(0,0,0,.22)}
    .update-pill .update-go{padding:9px 14px;border-radius:99px 0 0 99px;text-align:left}
    .update-pill .update-x{padding:9px 13px 9px 10px;border-radius:0 99px 99px 0;opacity:.92}
    html[data-theme="dem"] .update-pill button{background:#f3ede5;color:#15141b}
  </style>
  <link rel="preload" as="style" href="/css/app.css">
  <link rel="preload" as="style" href="/css/desks.css">
  <link rel="preload" as="style" href="/css/journey.css">
  <link rel="preload" as="style" href="/css/stories.css">
  <link rel="preload" as="style" href="/css/invest.css">
  <link rel="preload" as="style" href="/css/board.css">
  <link rel="preload" as="style" href="/css/life.css">
  <link rel="preload" as="style" href="/css/lifesheets.css">
  <link rel="preload" as="style" href="/css/pnl.css">
  <link rel="preload" as="style" href="/css/ai-chat.css">
  <link rel="preload" as="style" href="/css/guide.css">
  <link rel="preload" href="/fonts/be-vietnam-pro-vietnamese-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- server.py replaces this tag with the import map, the inlined boot script and modulepreloads (game/webassets.py). -->
  <script src="/js/boot.js" data-inline></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="loading" role="status"><div class="splash-logo" aria-hidden="true"></div><h1>Phố Có Chuyện</h1><p>Một ngày làm nghề · Đang mở cửa khu phố…</p><div class="splash-bar" aria-hidden="true"><i></i></div></div>
  <div id="app" hidden>
    <button type="button" class="brand" data-action="home" aria-label="Hành trình của bạn"><img src="/icons/logo-128.webp" alt="Phố Có Chuyện" width="42" height="42" decoding="async"></button>
    <header id="topbar" class="topbar"></header>
    <aside id="rail" class="rail" aria-label="Menu"></aside>
    <main id="stage" class="stage">
      <canvas id="world" tabindex="0" aria-label="Cảnh game. Bấm vào sàn để đi, bấm nhân vật hoặc đồ vật để tương tác. Có thể dùng các nút công việc ở thanh dưới thay cho canvas."></canvas>
      <div id="sceneHeading" class="scene-heading"></div>
      <div id="sceneBadge" class="scene-badge"></div>
      <div id="sceneHint" class="scene-hint"></div>
      <div id="ambientCaption" class="ambient-caption"></div>
      <div id="pauseOverlay" class="pause-overlay" hidden><div><span class="eyebrow">MỘT NHỊP NGHỈ</span><h2>Không cần vội.</h2><p>Mọi câu chuyện vẫn ở đây khi bạn quay lại.</p><button class="btn primary" data-action="resume">Tiếp tục chơi</button></div></div>
    </main>
    <div id="side" class="side">
      <section id="taskHUD" class="task-hud" aria-label="Công việc đang làm"></section>
      <nav id="dock" class="dock" aria-label="Tương tác trong cảnh"></nav>
    </div>
    <footer class="tiny-footer"><span id="saveState">Tiến trình lưu trên máy</span><span>v0.5 · Không có tiền thật · <a href="/privacy" target="_blank" rel="noopener">Quyền riêng tư</a> · <a href="/terms" target="_blank" rel="noopener">Điều khoản</a></span></footer>
  </div>
  <dialog id="sheet" class="sheet"><div id="sheetContent"></div></dialog>
  <dialog id="confirmDialog" class="confirm-dialog"><div id="confirmContent"></div></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <noscript>Trò chơi cần bật JavaScript. Chạy python server.py rồi mở địa chỉ server.</noscript>
</body>
</html>
