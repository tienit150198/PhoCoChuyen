<!doctype html>
<html lang="vi">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#59674b">
 <title>Góc phố 2.5D · Phố Có Chuyện</title>
 <link rel="stylesheet" href="./style.css">
</head>
<body>
 <main id="stage" aria-label="Một góc phố 2.5D chơi thử">
  <canvas id="scene" tabindex="0" aria-label="Chạm đường để đi, phím mũi tên hoặc W A S D để di chuyển tám hướng. Tới tiệm rồi nhấn E để trò chuyện."></canvas>
  <header class="topbar">
   <div class="brand"><span class="leaf" aria-hidden="true">❧</span><span><b>Phố Có Chuyện</b><small>Góc phố chơi thử · 2.5D</small></span></div>
   <button id="reset" class="round" aria-label="Về điểm bắt đầu" title="Về điểm bắt đầu">↺</button>
  </header>
  <div id="greeting" class="greeting">Ghé tiệm cô nhé!<span></span></div>
  <div id="loading" class="loading" role="status"><b>Một góc phố đang thức giấc…</b><span>Đang chuẩn bị cảnh và nhân vật</span></div>
  <div class="bottom-controls">
   <div id="stick" tabindex="0" role="group" aria-label="Cần di chuyển tám hướng"><span class="stick-guide" aria-hidden="true">✧</span><span id="knob"></span></div>
   <button id="talk" class="talk"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5h20a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H15l-7 5v-5H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/><circle cx="10" cy="14" r="1.4"/><circle cx="16" cy="14" r="1.4"/><circle cx="22" cy="14" r="1.4"/></svg><span>Ghé tiệm Cô Ba</span></button>
  </div>
  <p id="hint" class="hint" role="status">Kéo cần tròn hoặc chạm đường để đi dạo</p>
  <dialog id="conversation" aria-labelledby="speaker">
   <div class="portrait" id="portrait" aria-hidden="true"></div>
   <div class="conversation-head"><span><small id="place">Tạp hóa Cô Ba</small><b id="speaker">Cô Ba</b></span><button id="closeTalk" aria-label="Đóng trò chuyện">×</button></div>
   <p id="line"></p><div id="answers"></div>
  </dialog>
 </main>
 <script type="module" src="./app.js"></script>
</body>
</html>
