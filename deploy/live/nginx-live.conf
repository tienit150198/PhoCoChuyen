# In the server {} block of /etc/nginx/sites-enabled/phocochuyen (both the 443 server and, if present, any
# other server that serves the game). Then: nginx -t && systemctl reload nginx.
# Exact match: only /live is proxied (GET /live/health stays private to the host).
# Each socket holds two nginx connections: keep worker_connections x workers well above 2 x LIVE_MAX_CONN.
# On a reload, old workers keep their sockets up to worker_shutdown_timeout (20 s), then clients reconnect.
location = /live {
    proxy_pass http://127.0.0.1:8770;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
