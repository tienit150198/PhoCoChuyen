# 🎙️ Stage 2 (optional): TURN over TLS on port 443, for players whose network allows only 443 (school / office Wi-Fi,
# some carriers). nginx reads the TLS SNI of each new connection on :443 WITHOUT terminating it (ssl_preread):
#   turn.phocochuyen.io.vn  → TLS ends here (its own Let's Encrypt certificate) → LiveKit's TURN on 127.0.0.1:5349,
#                             plain TCP with a PROXY header (livekit.yaml: turn.external_tls, turn.proxy_protocol)
#   anything else           → the game site, unchanged, now listening on 127.0.0.1:8443 with the PROXY protocol so it
#                             still sees the real client address (limit_req, fail2ban, logs).
# install.sh stage2 copies this to /etc/nginx/mnl-stream.conf, adds `include /etc/nginx/mnl-stream.conf;` to the main
# context of /etc/nginx/nginx.conf (after the modules-enabled include), and changes the site's two `listen … 443` lines:
#     listen 443 ssl http2;                          →  listen 127.0.0.1:8443 ssl http2 proxy_protocol;
#     listen [::]:443 ssl http2 ipv6only=on;         →  (removed: the server has no global IPv6 address)
#   and adds to that server block:  set_real_ip_from 127.0.0.1;  real_ip_header proxy_protocol;
# LiveKit always advertises turns:turn.phocochuyen.io.vn:443?transport=tcp once turn.tls_port is set (pkg/service/
# roommanager.go), which is why it must be 443 and not another port.
stream {
    map $ssl_preread_server_name $mnl_tls_backend {
        turn.phocochuyen.io.vn   127.0.0.1:5350;
        default                  127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $mnl_tls_backend;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
    }

    # TLS for TURN ends here, then plain TURN to LiveKit with the client's address in a PROXY header.
    server {
        listen 127.0.0.1:5350 ssl proxy_protocol;
        ssl_certificate     /etc/letsencrypt/live/turn.phocochuyen.io.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/turn.phocochuyen.io.vn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        set_real_ip_from 127.0.0.1;
        proxy_pass 127.0.0.1:5349;
        proxy_protocol on;
        proxy_timeout 10m;
    }
}
