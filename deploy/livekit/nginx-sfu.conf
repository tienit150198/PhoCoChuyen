# 🎙️ The SFU's signal for browsers: wss://phocochuyen.io.vn/sfu/rtc… → LiveKit on 127.0.0.1:7880 (/rtc…).
# install.sh stage1 copies this to /etc/nginx/snippets/mnl-sfu.conf and includes it in the 443 server block of
# /etc/nginx/sites-enabled/phocochuyen (next to `location = /live`). Same origin as the game: no new certificate, no
# new DNS name, and the page's CSP already allows wss://<its host>.
# Only the WebSocket signal and LiveKit's /rtc/validate pass here; the media goes straight to :7881/tcp (ICE/TCP) or,
# in stage 2, through TURN/TLS on 443. The server API (/twirp) is NOT exposed: only the live service calls it, locally.
location /sfu/ {
    location ~ ^/sfu/twirp/ { return 404; }
    limit_req zone=mnl_live burst=10 nodelay;
    limit_conn mnl_liveconn 30;
    proxy_pass http://127.0.0.1:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";          # the game's session cookie never reaches the SFU
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
