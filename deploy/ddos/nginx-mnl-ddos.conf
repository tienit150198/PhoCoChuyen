# Phố Có Chuyện: request and connection limits per client address (after realip, so players forwarded by the
# old server count as themselves). Generous on purpose: Vietnamese mobile carriers share addresses (CGNAT).
# Measured 01/10: API peak 12 req/s per address, a cold load about 170 static files in one second.
limit_req_zone  $binary_remote_addr zone=mnl_api:20m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=mnl_auth:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr zone=mnl_boot:10m   rate=5r/s;
limit_req_zone  $binary_remote_addr zone=mnl_static:20m rate=300r/s;
limit_req_zone  $binary_remote_addr zone=mnl_live:10m   rate=2r/s;
limit_conn_zone $binary_remote_addr zone=mnl_conn:20m;
limit_conn_zone $binary_remote_addr zone=mnl_liveconn:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
# Slow clients (slowloris) and idle sockets
client_header_timeout 10s;
client_body_timeout   15s;
send_timeout          20s;
keepalive_timeout     30s;
reset_timedout_connection on;
