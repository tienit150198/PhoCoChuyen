# FAILED MIXED-CONFIGURATION DIAGNOSTIC ONLY. Not a validated deployment profile.
# PostgreSQL 16 with LZ4 support. Include from postgresql.conf after reviewing
# storage capacity, backup/replication needs and the measured workload.
# This file is not loaded automatically by the application.
wal_compression = lz4
max_wal_size = '4GB'

# Preserve commit/crash safety. max_wal_size is a soft checkpoint threshold,
# NOT a maximum disk allocation; allow additional room for WAL and backups.
fsync = on
synchronous_commit = on
full_page_writes = on
